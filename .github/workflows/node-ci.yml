name: NexusPort Node CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'node-core/**'
      - '.github/workflows/node-ci.yml'

  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'node-core/**'
      - '.github/workflows/node-ci.yml'

jobs:
  build-node:
    name: Build & Test Node Core
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: node-core

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'node-core/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Type Check & Build TypeScript
        run: npm run build

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest Test
        run: npm test
